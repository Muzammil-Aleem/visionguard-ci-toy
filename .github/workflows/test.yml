# Task 6.6 (toy part). Copy the whole labs/gha_toy folder into a NEW throwaway GitHub
# repository (it must be at the repo root for GitHub to find .github/workflows).
name: toy-tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -v
